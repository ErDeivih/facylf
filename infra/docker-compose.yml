# PostgreSQL canónico de la plataforma (ADR-0008).
# Escucha sólo en 127.0.0.1 y en el puerto 5433 para no chocar con otra instalación.
# Arranque (DESDE LA RAÍZ DEL REPOSITORIO, con el proyecto `facylf` y el .env que existe):
#   cd /srv/data/facylf && docker compose -p facylf --env-file docker/.env -f infra/docker-compose.yml up -d
#
# OJO con las dos trampas, comprobadas el 26/09/2026 con `--dry-run`:
#   · sin `-p facylf` el proyecto por defecto es «infra`» (el nombre del directorio), Docker NO reconoce el
#     contenedor que ya corre y **crearía otro** (`infra-postgres-1`) con su propia red y su propio volumen,
#     dejando la base canónica de verdad a un lado. El contenedor que corre pertenece al proyecto `facylf`;
#   · `--env-file .env` apunta a un fichero de la raíz que NO existe: el entorno está en `docker/.env`, y sin
#     él el compose se niega a arrancar porque POSTGRES_PASSWORD es obligatoria.
services:
  postgres:
    image: postgres:18
    container_name: facylf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: facylf
      POSTGRES_USER: facylf_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-ES --encoding=UTF8"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=50
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - random_page_cost=1.1
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
    ports:
      - "127.0.0.1:5433:5432"
    # Memoria compartida del contenedor (`/dev/shm`). Docker da 64 MB por defecto y las consultas que PostgreSQL
    # ejecuta en paralelo (las de la plataforma: cobertura, ojeo, buscador) piden segmentos mayores: con 64 MB
    # fallan con «could not resize shared memory segment … No space left on device». Medido el 23/10/2026: con
    # 1 GB no falla ninguna y no cuesta RAM reservada de verdad (es memoria compartida, sólo se llena si se usa).
    shm_size: 1gb
    volumes:
      # En PostgreSQL 18 la imagen espera el volumen en /var/lib/postgresql y coloca los datos en un
      # subdirectorio por versión mayor (así `pg_upgrade --link` funciona sin cruzar montajes).
      # Montarlo en /var/lib/postgresql/data, como se hacía hasta la 17, hace que el contenedor
      # arranque en bucle con «there appears to be PostgreSQL data in /var/lib/postgresql/data».
      - facylf-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facylf_admin -d facylf"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  facylf-pg:
