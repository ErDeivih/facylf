<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="32" height="32">
  <!--
    Marca de la cabecera (componentes/cabecera/CabeceraSitio.tsx, IconoMarca): cuadrado redondeado con
    el círculo y la cruz. Favicon servido por Next (convención app/icon.svg).

    Es un fichero estático y el navegador lo carga fuera de la página: no hereda variables CSS, así
    que lleva como literales los valores de los tokens de acento 700 y tinta 50 (tokens.css). No es un
    componente: aquí no hay tokens que aplicar. (Sin guiones dobles en este comentario: XML no los
    admite dentro de un comentario y el icono dejaría de parsearse.)
  -->
