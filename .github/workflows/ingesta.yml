name: ingesta

# DESACTIVADO A PROPÓSITO hasta que la ingesta sea real.
#
# Falta la URL del botón "Calendario Excel" de la federación, así que
# `pnpm ingesta:todas` termina con error 1. Si dejáramos el cron puesto, GitHub te
# mandaría un correo de fallo cada cinco minutos todos los fines de semana.
#
# Cuando la ingesta funcione, descomenta el bloque `schedule` de abajo. Las horas del
# cron son UTC; España va una o dos por delante según la época del año. La frecuencia
# fina la decide el propio worker (packages/ingesta/src/frecuencia.ts).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/5 7-20 * * 6,0'   # findes, horario de partidos
  #   - cron: '0 8-22 * * 1'       # lunes, actas que se cierran
  #   - cron: '0 8,14,20 * * 2-5'  # entre semana

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ingesta:todas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_URL: ${{ vars.BOT_URL }}
          BOT_CONTACTO: ${{ vars.BOT_CONTACTO }}
