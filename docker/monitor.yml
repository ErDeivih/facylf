# El monitor de la flota, en un contenedor.
#
# El servidor NO tiene Node instalado, así que el monitor corre dentro de `node:22-alpine` (imagen que ya está
# descargada allí: no hace falta `docker pull`, que es lo que el DNS roto impide). Habla con Docker por su socket
# y lee las colas del repositorio montado: ni un paquete más que instalar en el host.
#
# Arranque (desde la raíz del repositorio):
#   docker compose --env-file docker/.env -f docker/monitor.yml up -d
#
# Deja escrito, cada minuto:
#   estado/facylf.json        la foto de ahora
#   estado/historial.jsonl    una línea por vuelta (tendencias)
#   estado/alertas.log        lo que se ha avisado
# y avisa por ntfy. Con `FACYLF_KUMA_PUSH` (la URL del monitor «push» de Uptime-Kuma) además late.
services:
  monitor:
    image: node:22-alpine
    container_name: facylf-monitor
    restart: unless-stopped
    cgroup_parent: facylf.slice
    mem_limit: 256m
    # Y una cuota DURA de procesador, para que esto no pueda volver a pasar: la vigilancia no puede costar más
    # que lo vigilado. Con 1,0 núcleo el monitor sigue leyendo las colas (tardará más en dar la vuelta
    # completa) y su consumo queda acotado pase lo que pase.
    cpus: 1.0
    # Con el usuario del servidor y el GRUPO de Docker: así puede leer el socket (`root:996`, modo 660) y lo que
    # escribe en `estado/` queda como david, para que el `cron` del host siga escribiendo ahí. Medido el
    # 21/09/2026: como `1000:1000` el socket daba `EACCES`, y como root los ficheros quedaban de root y el cron
    # no habría podido tocarlos.
    user: "1000:996"
    # ── LA CADENCIA Y EL COSTE (ajustado el 25/09/2026) ───────────────────────────────────────────────
    #
    # Reevaluado el 25/09/2026: el estado completo de una cola son barridos sobre tablas de cientos de miles de
    # filas, y con 19 colas de 600-800 MB la rotación de 3 por vuelta mantenía al monitor barriendo sin parar.
    # Ahora una vuelta cada 2 minutos y UNA cola por vuelta (cada cola se relee cada ~19 min en vez de ~6). Las
    # señales que importan para avisar —última petición, peticiones y fallos de la ventana, plaza ocupada— se
    # siguen leyendo de TODAS las federaciones en cada vuelta, así que la detección de atascos no se retrasa.
    #
    # ── Y UN ERROR DE MEDICIÓN QUE NO HAY QUE REPETIR ─────────────────────────────────────────────────
    #
    # Ese mismo día el monitor pareció consumir **788 % de un núcleo** leyendo `cpu.stat` desde dentro. Era
    # falso: este contenedor monta `/sys/fs/cgroup` DEL HOST (lo necesita para vigilar la rebanada
    # `facylf.slice`), así que esa lectura devuelve el consumo de TODA la máquina, no el suyo. Medido bien, con
    # `docker stats`, el monitor no aparecía ni en el top: el consumo estaba en los recolectores (3,5 de los 4
    # núcleos, cada uno dentro de su cuota). Para medir un contenedor hay que usar el daemon, no el cgroup que
    # el propio contenedor tiene montado.
    command: ["node", "/app/scripts/monitor-flota.mjs", "--cada-seg", "120"]
    environment:
      FACYLF_RAIZ: /app
      FACYLF_ESTADO_DIR: /app/estado
      FACYLF_DOCKER_SOCK: /var/run/docker.sock
      # ── EL TECHO DE MEMORIA QUE SE VIGILA (22/09/2026) ────────────────────────────────────────────────
      #
      # No es el «presupuesto de plazas» (`FACYLF_MEMORIA_GB`): es el techo REAL de la rebanada, que es lo que
      # decide si el aviso de memoria alta tiene sentido. La máquina tiene 15,9 GB y aquí viven también
      # PostgreSQL y la web, así que se declaran 14 GB y el aviso salta al 85 % de eso (≈11,9 GB).
      #
      # Antes estaba fijo en 10 y el aviso saltaba a los 9 GB: con la flota usando 9,5 GB de 10 —lo previsto—
      # avisaba cada cuarto de hora, y una alerta que suena siempre deja de ser una alerta.
      FACYLF_SLICE_GB: "${FACYLF_SLICE_GB:-14}"
      # La respuesta del canónico la deja el `cron` del host en este fichero (dentro del contenedor no hay
      # cliente de PostgreSQL). Sin esta variable el monitor intentaría `docker exec`, que aquí no existe.
      FACYLF_CANONICO_TXT: /app/estado/canonico.txt
      # Y el consumo de contenedores, por si algún día el socket no se puede leer: el cron también lo deja hecho.
      FACYLF_CONTENEDORES_TXT: /app/estado/contenedores.txt
      # Los dos avisos. `host.docker.internal` es el servidor de casa: ntfy escucha ahí en el 8085.
      FACYLF_NTFY: "${FACYLF_NTFY:-http://host.docker.internal:8085/facylf}"
      FACYLF_KUMA_PUSH: "${FACYLF_KUMA_PUSH:-}"
      # Una cola entera por vuelta (antes 3): es lo que reparte el barrido gordo sin retrasar los avisos.
      FACYLF_COLAS_POR_VUELTA: "${FACYLF_COLAS_POR_VUELTA:-1}"
      # Las que recoge el PC: fuera de la vigilancia de este servidor, o avisa de lo que no es una avería.
      FACYLF_EXCLUIR: "${FACYLF_EXCLUIR:-valencia,madrid,cataluna,andalucia}"
      # El suelo de temporadas (11/10/2026). Sin esta línea el monitor usaba el 2023-24 por defecto y no veía el
      # histórico: enseñaba «sin-trabajo» a Rioja y «casi terminadas» a federaciones con 15.000-60.000 trabajos
      # vencidos, mientras los recolectores (que sí reciben 2010-11 por `docker/.env`) trabajaban en ellos.
      FACYLF_TEMPORADA_MINIMA: "${FACYLF_TEMPORADA_MINIMA:-2010-11}"
      TZ: Europe/Madrid
    volumes:
      # El repositorio entero: las colas, el estado y los guiones viven ahí.
      - ..:/app
      # Las colas que se hayan movido al SSD (piloto del 23/09/2026) tienen un ENLACE en su ruta de siempre.
      # Para que el enlace resuelva aquí también, el árbol del SSD se monta en la MISMA ruta absoluta que en el
      # host. Sin esto, el monitor vería las colas de esas federaciones como ilegibles.
      - /srv/ssd/facylf:/srv/ssd/facylf
      # El socket de Docker, en sólo lectura, para saber el consumo de cada contenedor.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Los contadores de la rebanada de memoria (el tope de 10 GB del proyecto).
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
