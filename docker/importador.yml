# El importador masivo: de las colas SQLite al canónico, por tandas y con prioridad baja.
#
# Usa LA MISMA IMAGEN que los recolectores (tiene Node, pnpm, tsx y el programa) y el mismo repositorio montado,
# así que no hay nada que construir aparte. Va en `facylf.slice` (dentro del tope de 10 GB del proyecto) con
# poco CPU: la recolección manda, y la importación aprovecha lo que sobra.
#
# Arranque (desde la raíz del repositorio):
#   docker compose --env-file docker/.env -f docker/importador.yml up -d
#
# Hace tandas de 3 horas y luego espera media hora: así no compite de forma continua con la recolección ni con
# RadioPV, y deja el canónico creciendo de forma sostenida. El estado queda en `estado/importacion.json`.
services:
  importador:
    image: facylf-recolectores:local
    container_name: facylf-importador
    restart: unless-stopped
    cgroup_parent: facylf.slice
    mem_limit: 1g
    # Poca CPU y con poco peso en el reparto: la recolección es lo primero.
    cpus: "${FACYLF_CPUS_IMPORTADOR:-1.0}"
    cpu_shares: 256
    environment:
      DATABASE_URL_PUBLICADOR: "${DATABASE_URL_PUBLICADOR:?falta DATABASE_URL_PUBLICADOR en docker/.env (rol facylf_publicador)}"
      FACYLF_RAIZ: /app
      FACYLF_ESTADO_DIR: /app/estado
      FACYLF_NTFY: "${FACYLF_NTFY:-http://host.docker.internal:8085/facylf}"
      TZ: Europe/Madrid
    volumes:
      # El repositorio: las colas que se leen y el estado que se escribe.
      - ..:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Una tanda de 3 h y 30 min de espera, en bucle. `tini` recoge los hijos si algo se queda colgado.
    entrypoint: ["/usr/bin/tini", "--"]
    command:
      - bash
      - -lc
      - |
        while true; do
          node /app/scripts/importar-masivo.mjs --minutos 180 || true
          sleep 1800
        done
