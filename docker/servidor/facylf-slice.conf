[Slice]
# Tope DURO de memoria para todo el proyecto de recolección en el servidor.
#
# Los contenedores del compose cuelgan de esta rebanada (`cgroup_parent: facylf.slice`), así que este número
# manda por encima de los límites por contenedor: si entre todos se pasan, el kernel no deja crecer más y lo que
# se queda sin memoria es un recolector (que reintenta), no el servidor.
#
# 10G es el presupuesto que pidió el responsable del proyecto. El reparto fino lo hace el gobernador de dentro
# (11 plazas de 0,75 GB con `FACYLF_MEMORIA_GB=10`); esto es la red de seguridad de fuera.
MemoryMax=10G

# Sin intercambio: en un servidor de recolección, paginar es peor que no recolectar (todo se vuelve lentísimo y
# los navegadores empiezan a morir por tiempo de espera). Es mejor que un contenedor se quede sin memoria.
MemorySwapMax=0

# Aviso antes de llegar al tope, para poder mirarlo en el registro del sistema.
MemoryHigh=9G
