    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "castilla-la-mancha"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-castilla-la-mancha:/app/descargas-castilla-la-mancha

  cataluna:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "cataluna"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-cataluna:/app/descargas-cataluna

  ceuta:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "ceuta"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-ceuta:/app/descargas-ceuta

  euskadi:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "euskadi"]
    volumes:
      - plazas:/app/.estado-workers
