# Recolectores de FACyLF en Docker, para un servidor Debian de 10 GB.
#
# CÓMO SE REPARTE LA MEMORIA (esto es lo que hay que entender antes de tocar nada):
#
#   1. **Dentro**: el gobernador de plazas (`scripts/lib/presupuesto-memoria.mjs`) reparte el presupuesto
#      declarado en `FACYLF_MEMORIA_GB` (10 por defecto). Las fichas de plaza viven en el volumen `plazas`, que
#      ven TODOS los contenedores, así que el reparto es compartido: aunque cada federación esté en su
#      contenedor, no pueden decidir por su cuenta que hay sitio. Con 10 GB salen **11 plazas** de 0,75 GB.
#   2. **Fuera**: cada contenedor lleva su propio `mem_limit` (1,2 GB: un navegador con holgura) y **todos**
#      cuelgan de la misma rebanada de cgroup (`facylf.slice`), que es donde se pone el tope duro de 10 GB:
#
#          sudo systemctl set-property --runtime facylf.slice MemoryMax=10G
#
#      (o un fichero `/etc/systemd/system/facylf.slice.d/limite.conf` para que sobreviva a un reinicio; está
#      explicado en `docker/README.md`).
#
# Añadir una federación es copiar un bloque de servicio y crear su carpeta de datos.
#
# Uso:  docker compose -f docker/compose.yml up -d
#       docker compose -f docker/compose.yml logs -f galicia
# ── EL ENTORNO VA EN SU PROPIA ANCLA, Y NO ES UN CAPRICHO ────────────────────────────────────────────────
#
# Las variables comunes viven aparte para poder FUSIONARLAS cuando un servicio necesita añadir la suya. En
# YAML, `<<: *ancla` fusiona CLAVES: si el servicio declara su propio `environment:`, **reemplaza el del ancla
# entero** en vez de añadirse a él.
#
# Eso pasó el 23/09/2026, y costó una federación entera: al añadir `FACYLF_PERF: "1"` a Murcia para medir el
# ciclo por fases, Murcia se quedó SIN `FACYLF_MEMORIA_GB`. Y ese número no es decorativo:
#
#   · `repartePlazas` cae al respaldo («la mitad de la memoria del equipo») → 8 plazas en vez de 16;
#   · y sobre todo `RESERVA_AIRE_GB` vuelve a 1,5 GB (en vez de 0,25). En un contenedor de 1,6 GB **nunca**
#     caben 1,5 GB libres, así que el worker se quedó en «esperando para abrir Chrome» para siempre. Es el
#     mismo atasco que se documentó el 18/09/2026, y no se ve en `docker ps`: el contenedor sigue «arriba»
#     mientras la federación no recoge nada.
#
# Con esta ancla, un servicio que necesite una variable extra hace:
#
#     environment:
#       <<: *ambiente-recolector
#       FACYLF_LO_QUE_SEA: "1"
#
# Hay una herramienta para comprobarlo: `scripts/servidor/compara-entorno-recolectores.sh`.
x-ambiente-recolector: &ambiente-recolector
  TZ: Europe/Madrid
  FACYLF_MEMORIA_GB: "${FACYLF_MEMORIA_GB:-10}"
  FACYLF_CHROME_HEADLESS: "1"
  # Turno máximo con una plaza cuando hay federaciones esperando: es lo que hace que todas entren a lo largo
  # del día en un servidor donde no caben las 19 a la vez.
  FACYLF_TURNO_PLAZA_MIN: "${FACYLF_TURNO_PLAZA_MIN:-150}"

x-comun: &recolector
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: facylf-recolectores:local
  restart: unless-stopped
  cgroup_parent: facylf.slice
  # ── DNS EXPLÍCITO (21/09/2026) ──────────────────────────────────────────────────────────────────────────
  #
  # El servidor tiene en `/etc/resolv.conf` los resolutores de Tailscale (`100.100.1.1`) pero Tailscale tiene el
  # DNS desactivado en esa máquina, así que el HOST no resuelve nada: ni `apt`, ni `docker pull`, ni el
  # autodeploy. Con Chrome dentro del contenedor el síntoma fue `net::ERR_NAME_NOT_RESOLVED` y la federación no
  # podía abrir un solo portal.
  #
  # Poner aquí los resolutores que SÍ existen evita el problema sin tocar el host (que necesita `sudo`):
  # el router de casa y Cloudflare. Si el servidor se muda de red, esto es lo primero que hay que revisar.
  dns:
    - "${FACYLF_DNS_1:-192.168.1.1}"
    - "${FACYLF_DNS_2:-1.1.1.1}"
  # Un navegador sin cabeza con sus procesos auxiliares medido dentro del contenedor: ~1,0 GB de RSS (que
  # sobreestima, porque Chrome comparte memoria entre sus procesos). El límite por contenedor es una red de
  # seguridad para un navegador desbocado, no el reparto: el reparto lo lleva el gobernador (11 plazas) y el
  # tope del conjunto lo pone la rebanada de cgroup de 10 GB.
  mem_limit: 1600m
  # Chrome necesita memoria compartida; los 64 MB por defecto de Docker se quedan cortos a la tercera página
  # (además el arranque añade --disable-dev-shm-usage cuando va sin cabeza).
  shm_size: 512m
  # ── TOPE DE PROCESADOR POR RECOLECTOR (20/09/2026) ───────────────────────────────────────────────────────
  #
  # El procesador del servidor es PEOR que el del PC donde se ha probado, y el PC ya se ponía al 100 % con la
  # flota: medido, los navegadores se llevaban 859 % de 1.114 % sobre 12 núcleos. Sin un tope, un puñado de
  # recolectores puede dejar sin CPU al resto del servidor (la web pública, el importador, la base de datos).
  #
  # Con esto, cada recolector no pasa de la mitad de un núcleo: la recolección va más despacio y **el servidor
  # sigue siendo utilizable**, que es la prioridad. Se ajusta con `FACYLF_CPUS_POR_RECOLECTOR` en el `.env`
  # (por ejemplo `1` si el servidor tiene núcleos de sobra).
  cpus: "${FACYLF_CPUS_POR_RECOLECTOR:-0.5}"
  # El entorno común viene de su ancla, para que un servicio pueda AÑADIR variables sin perderlo (ver arriba).
  environment: *ambiente-recolector
  volumes:
    - plazas:/app/.estado-workers
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  andalucia:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "andalucia"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-andalucia:/app/descargas-andalucia

  aragon:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "aragon"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-aragon:/app/descargas-aragon

  asturias:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "asturias"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-asturias:/app/descargas-asturias

  baleares:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "baleares"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-baleares:/app/descargas-baleares

  canarias:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "canarias"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-canarias:/app/descargas-canarias

  cantabria:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "cantabria"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-cantabria:/app/descargas-cantabria

  castilla-la-mancha:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "castilla-la-mancha"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-castilla-la-mancha:/app/descargas-castilla-la-mancha

  cataluna:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "cataluna"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-cataluna:/app/descargas-cataluna

  ceuta:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "ceuta"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-ceuta:/app/descargas-ceuta

  euskadi:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "euskadi"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-euskadi:/app/descargas-euskadi

  extremadura:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "extremadura"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-extremadura:/app/descargas-extremadura

  federacion:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "federacion"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-federacion:/app/descargas-federacion
      # (Aquí hubo un montaje del lanzador desde el repositorio, del 21/09/2026 al 22/09/2026: Castilla y León
      #  es la única federación que va SIN `--perfil`, y esa rama se añadió a `entrada-recolector.sh` después de
      #  construir la imagen. Con el DNS del servidor roto no se podía reconstruir. Ya no hace falta: la imagen
      #  se reconstruyó el 22/09/2026 y trae el lanzador corregido.)
      #
      # ── SU CONFIGURACIÓN VA MONTADA, NO DENTRO DE LA IMAGEN (23/09/2026) ─────────────────────────────────
      #
      # Castilla y León es la ÚNICA federación sin `--perfil`: el recolector decide su portal y su carpeta por
      # la AUSENCIA de ese argumento y lee `recolector.config.json` de la raíz. Y ese fichero **está en
      # `.gitignore`**, así que nunca llegó al servidor; como la imagen se construye desde el repositorio del
      # servidor, **no lo contenía**. Consecuencia medida el 23/09/2026: `opcionesChrome()` lanzaba
      # «Falta el contacto real (identidad.contacto) en recolector.config.json», el worker moría con código 1
      # en cada arranque y **la federación no recogía NADA**, con 45.935 trabajos esperando en su cola. El
      # monitor la contaba como «sin trabajo», que es lo que ocultaba la avería.
      #
      # Se monta en vez de copiarla a la imagen por el mismo motivo que el resto de los datos: es
      # configuración, no programa, y así se puede ajustar sin reconstruir. Las otras 18 federaciones llevan su
      # `recolector.<federación>.config.json` dentro de la imagen porque SÍ están versionados.
      - ../recolector.config.json:/app/recolector.config.json:ro

  galicia:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "galicia"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-galicia:/app/descargas-galicia

  madrid:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "madrid"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-madrid:/app/descargas-madrid
      # ── EL CATÁLOGO DE SONDEO, POR VOLUMEN Y NO DENTRO DE LA IMAGEN (22/09/2026) ─────────────────────
      #
      # Madrid y Valencia (iSquad) leen el catálogo del sondeo, que vive en `descargas-federacion-sondeo/`. Esa
      # carpeta está en `.gitignore` —es DATO, no programa— así que no está en el repositorio y, al reconstruir
      # la imagen, dejó de estar dentro: los dos recolectores empezaron a fallar con
      #
      #     Error: No existe el catálogo de Valencia: /app/descargas-federacion-sondeo/valencia-isquad-sondeo.json
      #
      # Además, cada actualización del repositorio del servidor aparta en un `stash` lo que no está versionado,
      # así que meterlo en la imagen era frágil de todas formas. Se monta, como el resto de los datos.
      - ../descargas-federacion-sondeo:/app/descargas-federacion-sondeo:ro

  melilla:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "melilla"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-melilla:/app/descargas-melilla

  murcia:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "murcia"]
    # ── FEDERACIÓN DE MEDICIÓN: el ciclo por fases (23/09/2026) ─────────────────────────────────────────────
    #
    # El traspaso pedía instrumentar el ciclo del worker «en UNA federación primero (por ejemplo galicia o
    # murcia), y sólo después al resto». Es Murcia porque es una PNFG corriente, con volumen suficiente para
    # tener muestra en minutos y sin las particularidades que contaminarían la medida: Galicia acumula esperas
    # por la cola («database is locked», 250 medidas) y Melilla/Cataluña tienen los portales más pesados.
    #
    # Con `FACYLF_PERF=1` el recolector apunta una línea por trabajo en
    # `descargas-murcia/recolector-local/perf-fases.jsonl` y se lee con `analiza-fases.mjs`. **Sin esta
    # variable el código de medición no ejecuta ni una línea**, así que las demás federaciones siguen igual.
    #
    # CUANDO TERMINE LA MEDICIÓN, ESTA VARIABLE SE QUITA: es un instrumento, no una configuración. Dejarla
    # puesta haría que Murcia escribiera un fichero para siempre a cambio de nada.
    environment:
      <<: *ambiente-recolector
      FACYLF_PERF: "1"
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-murcia:/app/descargas-murcia

  navarra:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "navarra"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-navarra:/app/descargas-navarra

  rioja:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "rioja"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-rioja:/app/descargas-rioja

  valencia:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "valencia"]
    # ── ESCALÓN DE CORTESÍA EN PRUEBA (23/09/2026) ──────────────────────────────────────────────────────────
    #
    # Valencia es la ÚNICA federación cuyo ritmo lo manda de verdad la cortesía: medido, su hueco mediano entre
    # inicios de petición es 5,6 s y tiene 4-6 s configurados, así que sí está esperando. En las PNFG el hueco
    # mediano es 8,8-19,9 s, MÁS que su cortesía máxima (8 s): allí `ritmo.antes()` espera 0 s porque el trabajo
    # ya dura más, y bajar el intervalo no cambiaría nada.
    #
    # Se prueba aquí sin reconstruir la imagen porque `docker/entrada-recolector.sh` reenvía `FACYLF_ARGS` al
    # worker (los dos recolectores aceptan `--intervalo-min`/`--intervalo-max` por línea de órdenes y usan el
    # fichero de configuración sólo como respaldo). Se aplica recreando el contenedor:
    #     bash scripts/servidor/aplica-turnos.sh valencia
    #
    # ¡OJO CON EL SUELO DE 4 S! `Ritmo` comprueba `minimo < 4000` y **lanza un error** si no se cumple: un
    # `--intervalo-min` por debajo de 4 s NO baja el ritmo, DEJA LA FEDERACIÓN SIN RECOLECTAR (el worker muere con
    # código 1 y el supervisor reintenta cada 20 s). Pasó el 23/09/2026 probando 2-3 s: Valencia estuvo 37
    # minutos sin hacer una sola petición y el ritmo total de la flota cayó de ~65 a 57 pet/min. Es un suelo de
    # cortesía deliberado, no un límite técnico: se respeta.
    #
    # Por eso el escalón más bajo posible aquí es 4-5 s (media 4,5 frente a los 5,0 actuales, ~10 % menos espera).
    environment:
      <<: *ambiente-recolector
      FACYLF_ARGS: "--intervalo-min 4 --intervalo-max 5"
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-valencia:/app/descargas-valencia
      # Mismo caso que Madrid: el catálogo del sondeo es DATO y va montado (ver el comentario de Madrid).
      - ../descargas-federacion-sondeo:/app/descargas-federacion-sondeo:ro

  # La federación de PRUEBA (`prueba-10gb`): misma cola que se usa en el PC para las pruebas del programa de
  # 10 GB. No es una federación real: sirve para comprobar que la imagen y el compose funcionan antes de tocar
  # nada de producción —
  #
  #     docker compose -f docker/compose.yml up -d prueba-10gb
  #
  # — y su cola lleva una marca `.PRUEBA` para que los informes de la flota no la cuenten como federación.
  #
  # Va en su PROPIO PERFIL (`pruebas`): así un `docker compose up -d` en el servidor levanta las federaciones de
  # verdad y no la de prueba. Y `docker compose up -d prueba-10gb` sigue funcionando igual, porque nombrar un
  # servicio activa su perfil (comprobado el 19/09/2026).
  prueba-10gb:
    profiles: ["pruebas"]
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "prueba-10gb"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-prueba-10gb:/app/descargas-prueba-10gb

  # La pasada del fin de semana: reabre jornadas y actas del sábado y el domingo en TODAS las federaciones y
  # deja su informe. Necesita ver las colas de todas, por eso monta todas las carpetas.
  fin-de-semana:
    <<: *recolector
    mem_limit: 512m
    command: ["bash", "docker/entrada-fin-de-semana.sh", "${FACYLF_HORA_FINDE:-07:30}"]
    volumes:
      - plazas:/app/.estado-workers
      - ../pruebas/reconstruccion:/app/pruebas/reconstruccion
      - ../descargas-andalucia:/app/descargas-andalucia
      - ../descargas-aragon:/app/descargas-aragon
      - ../descargas-asturias:/app/descargas-asturias
      - ../descargas-baleares:/app/descargas-baleares
      - ../descargas-canarias:/app/descargas-canarias
      - ../descargas-cantabria:/app/descargas-cantabria
      - ../descargas-castilla-la-mancha:/app/descargas-castilla-la-mancha
      - ../descargas-cataluna:/app/descargas-cataluna
      - ../descargas-ceuta:/app/descargas-ceuta
      - ../descargas-euskadi:/app/descargas-euskadi
      - ../descargas-extremadura:/app/descargas-extremadura
      - ../descargas-federacion:/app/descargas-federacion
      - ../descargas-galicia:/app/descargas-galicia
      - ../descargas-madrid:/app/descargas-madrid
      - ../descargas-melilla:/app/descargas-melilla
      - ../descargas-murcia:/app/descargas-murcia
      - ../descargas-navarra:/app/descargas-navarra
      - ../descargas-rioja:/app/descargas-rioja
      - ../descargas-valencia:/app/descargas-valencia
      # El catálogo del sondeo va montado por el mismo motivo que en Madrid y Valencia: es dato, no está en el
      # repositorio, y sin él los dos recolectores de iSquad no arrancan.
      - ../descargas-federacion-sondeo:/app/descargas-federacion-sondeo:ro

  # La VIGILANCIA no va aquí a propósito: mide los contenedores DESDE FUERA (memoria de cada uno por cgroups,
  # reinicios, plazas ocupadas y quién espera) y para eso necesita el cliente de Docker, que no está —ni hace
  # falta— dentro de la imagen de los recolectores. Se programa con `cron` en el servidor:
  #
  #   0 * * * * cd /srv/facylf && node scripts/vigilar-docker.mjs --cada-min 1 --duracion-min 1 \
  #     >> pruebas/reconstruccion/vigilancia-cron.log 2>&1
  #
  # y su tendencia se mira con `node scripts/vigilar-docker.mjs --informe`.

volumes:
  # Las fichas de plaza de navegador, compartidas por TODOS los contenedores: es el semáforo del presupuesto.
  plazas:
