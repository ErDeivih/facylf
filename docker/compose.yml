# Recolectores de FACyLF en Docker, para un servidor Debian de 10 GB.
#
# CÓMO SE REPARTE LA MEMORIA (esto es lo que hay que entender antes de tocar nada):
#
#   1. **Dentro**: el gobernador de plazas (`scripts/lib/presupuesto-memoria.mjs`) reparte el presupuesto
#      declarado en `FACYLF_MEMORIA_GB` (10 por defecto). Las fichas de plaza viven en el volumen `plazas`, que
#      ven TODOS los contenedores, así que el reparto es compartido: aunque cada federación esté en su
#      contenedor, no pueden decidir por su cuenta que hay sitio. Con 10 GB salen **11 plazas** de 0,75 GB.
#   2. **Fuera**: cada contenedor lleva su propio `mem_limit` (1,2 GB: un navegador con holgura) y **todos**
#      cuelgan de la misma rebanada de cgroup (`facylf.slice`), que es donde se pone el tope duro de 10 GB:
#
#          sudo systemctl set-property --runtime facylf.slice MemoryMax=10G
#
#      (o un fichero `/etc/systemd/system/facylf.slice.d/limite.conf` para que sobreviva a un reinicio; está
#      explicado en `docker/README.md`).
#
# Añadir una federación es copiar un bloque de servicio y crear su carpeta de datos.
#
# Uso:  docker compose -f docker/compose.yml up -d
#       docker compose -f docker/compose.yml logs -f galicia
x-comun: &recolector
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: facylf-recolectores:local
  restart: unless-stopped
  cgroup_parent: facylf.slice
  # Un navegador sin cabeza con sus procesos auxiliares medido dentro del contenedor: ~1,0 GB de RSS (que
  # sobreestima, porque Chrome comparte memoria entre sus procesos). El límite por contenedor es una red de
  # seguridad para un navegador desbocado, no el reparto: el reparto lo lleva el gobernador (11 plazas) y el
  # tope del conjunto lo pone la rebanada de cgroup de 10 GB.
  mem_limit: 1600m
  # Chrome necesita memoria compartida; los 64 MB por defecto de Docker se quedan cortos a la tercera página
  # (además el arranque añade --disable-dev-shm-usage cuando va sin cabeza).
  shm_size: 512m
  # ── TOPE DE PROCESADOR POR RECOLECTOR (20/09/2026) ───────────────────────────────────────────────────────
  #
  # El procesador del servidor es PEOR que el del PC donde se ha probado, y el PC ya se ponía al 100 % con la
  # flota: medido, los navegadores se llevaban 859 % de 1.114 % sobre 12 núcleos. Sin un tope, un puñado de
  # recolectores puede dejar sin CPU al resto del servidor (la web pública, el importador, la base de datos).
  #
  # Con esto, cada recolector no pasa de la mitad de un núcleo: la recolección va más despacio y **el servidor
  # sigue siendo utilizable**, que es la prioridad. Se ajusta con `FACYLF_CPUS_POR_RECOLECTOR` en el `.env`
  # (por ejemplo `1` si el servidor tiene núcleos de sobra).
  cpus: "${FACYLF_CPUS_POR_RECOLECTOR:-0.5}"
  environment:
    TZ: Europe/Madrid
    FACYLF_MEMORIA_GB: "${FACYLF_MEMORIA_GB:-10}"
    FACYLF_CHROME_HEADLESS: "1"
    # Turno máximo con una plaza cuando hay federaciones esperando: es lo que hace que todas entren a lo largo
    # del día en un servidor donde no caben las 19 a la vez.
    FACYLF_TURNO_PLAZA_MIN: "${FACYLF_TURNO_PLAZA_MIN:-150}"
  volumes:
    - plazas:/app/.estado-workers
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  andalucia:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "andalucia"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-andalucia:/app/descargas-andalucia

  aragon:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "aragon"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-aragon:/app/descargas-aragon

  asturias:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "asturias"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-asturias:/app/descargas-asturias

  baleares:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "baleares"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-baleares:/app/descargas-baleares

  canarias:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "canarias"]
    volumes:
