# Recolectores de FACyLF en Docker, para un servidor Debian de 10 GB.
#
# CÓMO SE REPARTE LA MEMORIA (esto es lo que hay que entender antes de tocar nada):
#
#   1. **Dentro**: el gobernador de plazas (`scripts/lib/presupuesto-memoria.mjs`) reparte el presupuesto
#      declarado en `FACYLF_MEMORIA_GB` (10 por defecto). Las fichas de plaza viven en el volumen `plazas`, que
#      ven TODOS los contenedores, así que el reparto es compartido: aunque cada federación esté en su
#      contenedor, no pueden decidir por su cuenta que hay sitio. Con 10 GB salen **11 plazas** de 0,75 GB.
#   2. **Fuera**: cada contenedor lleva su propio `mem_limit` (1,2 GB: un navegador con holgura) y **todos**
#      cuelgan de la misma rebanada de cgroup (`facylf.slice`), que es donde se pone el tope duro de 10 GB:
#
#          sudo systemctl set-property --runtime facylf.slice MemoryMax=10G
#
#      (o un fichero `/etc/systemd/system/facylf.slice.d/limite.conf` para que sobreviva a un reinicio; está
#      explicado en `docker/README.md`).
#
# Añadir una federación es copiar un bloque de servicio y crear su carpeta de datos.
#
# Uso:  docker compose -f docker/compose.yml up -d
#       docker compose -f docker/compose.yml logs -f galicia
# ── EL ENTORNO VA EN SU PROPIA ANCLA, Y NO ES UN CAPRICHO ────────────────────────────────────────────────
#
# Las variables comunes viven aparte para poder FUSIONARLAS cuando un servicio necesita añadir la suya. En
# YAML, `<<: *ancla` fusiona CLAVES: si el servicio declara su propio `environment:`, **reemplaza el del ancla
# entero** en vez de añadirse a él.
#
# Eso pasó el 23/09/2026, y costó una federación entera: al añadir `FACYLF_PERF: "1"` a Murcia para medir el
# ciclo por fases, Murcia se quedó SIN `FACYLF_MEMORIA_GB`. Y ese número no es decorativo:
#
#   · `repartePlazas` cae al respaldo («la mitad de la memoria del equipo») → 8 plazas en vez de 16;
#   · y sobre todo `RESERVA_AIRE_GB` vuelve a 1,5 GB (en vez de 0,25). En un contenedor de 1,6 GB **nunca**
#     caben 1,5 GB libres, así que el worker se quedó en «esperando para abrir Chrome» para siempre. Es el
#     mismo atasco que se documentó el 18/09/2026, y no se ve en `docker ps`: el contenedor sigue «arriba»
#     mientras la federación no recoge nada.
#
# Con esta ancla, un servicio que necesite una variable extra hace:
#
#     environment:
#       <<: *ambiente-recolector
#       FACYLF_LO_QUE_SEA: "1"
#
# Hay una herramienta para comprobarlo: `scripts/servidor/compara-entorno-recolectores.sh`.
x-ambiente-recolector: &ambiente-recolector
  TZ: Europe/Madrid
  FACYLF_MEMORIA_GB: "${FACYLF_MEMORIA_GB:-10}"
  FACYLF_CHROME_HEADLESS: "1"
  # Perfiles de Chrome en el SSD, no en el disco duro de /srv/data (09/10/2026: disco al 87 % con 126 operaciones/s,
  # presión de E/S al 94-98 %, carga 45). Ver `rutaPerfilChrome()` en scripts/recolector-local.mjs.
  FACYLF_DIR_PERFILES_CHROME: "${FACYLF_DIR_PERFILES_CHROME:-/srv/ssd/facylf/perfiles-chrome}"
  # ── SUELO DE TEMPORADAS: SE RETOMA EL HISTÓRICO (06/10/2026) ────────────────────────────────────────────
  #
  # El 14/09/2026 se decidió recoger sólo de 2023-24 en adelante, y lo anterior quedó APLAZADO —no borrado— con
  # la fecha centinela `2099-01-01`, que en este proyecto significa «nunca». Se retoma, y la razón está medida:
  # las dieciséis federaciones hacían 1.769 peticiones por hora entre todas cuando su capacidad ronda las
  # 8.000. **El histórico no le quita el turno al presente: llena el hueco.**
  #
  # El suelo se cambia sin tocar código (`lib/temporada-minima.mjs`, que lo dice en su comentario). El valor
  # real va en `.env`.
  #
  # OJO: esto YA SE PERDIÓ UNA VEZ. Se añadió a mano SÓLO en el servidor y, al copiar después el `compose.yml`
  # del repositorio encima, desapareció sin que nada avisara. Por eso está aquí, en el fichero versionado.
  FACYLF_TEMPORADA_MINIMA: "${FACYLF_TEMPORADA_MINIMA:-2010-11}"
  # Turno máximo con una plaza cuando hay federaciones esperando: es lo que hace que todas entren a lo largo
  # del día en un servidor donde no caben las 19 a la vez.
  FACYLF_TURNO_PLAZA_MIN: "${FACYLF_TURNO_PLAZA_MIN:-150}"
  # ── DOS AJUSTES DE ESCRITURA, PROBADOS Y AHORA PARA TODA LA FLOTA (23/09/2026) ──────────────────────────
  #
  # Los dos salen de partir el ciclo del worker por fases. Medido con `analiza-fases.mjs`, el grueso del ciclo
  # no era el portal: eran NUESTRAS escrituras, y dentro de ellas los `insert` de `guardaActaEstructura`.
  #
  # 1. `FACYLF_SINCRONO=NORMAL` — SQLite con `synchronous = FULL` (su valor por defecto) sincroniza el disco en
  #    CADA confirmación, y en el disco duro eso son **540 ms de mediana** (3,8 ms en el SSD). Guardar un acta
  #    hacía varias confirmaciones sueltas. Con `NORMAL` la confirmación cuesta 0,0 ms. En modo WAL sigue siendo
  #    seguro frente a la CORRUPCIÓN; lo que puede perderse, si se va la luz, son las últimas confirmaciones, y
  #    aquí eso sólo significa repetir peticiones ya hechas, porque la cola es idempotente.
  #    Medido: Murcia −19 % de ciclo, Andalucía −11 %.
  #
  # 2. `FACYLF_CACHE_MB=32` — la caché por defecto de SQLite son **2 MB** y las colas son de 414-524 MB, o sea
  #    que cabe el **0,5 %**: casi toda página que toca un `insert` hay que ir a buscarla al disco. Medido en
  #    Andalucía: ciclo 11,1 s → 8,4 s y escrituras 6,27 s → 4,11 s. Es memoria, no disco ni durabilidad.
  #    32 MB por recolector son ~608 MB en total y la rebanada `facylf.slice` tiene 12 GB de tope, así que
  #    conviene vigilar `MemoryCurrent` si se sube más.
  #
  # Se pueden cambiar sin tocar el compose, desde `docker/.env`:
  #     FACYLF_SINCRONO=FULL        (vuelve al comportamiento de siempre)
  #     FACYLF_CACHE_MB=              (deja la caché que trae SQLite)
  FACYLF_SINCRONO: "${FACYLF_SINCRONO:-NORMAL}"
  FACYLF_CACHE_MB: "${FACYLF_CACHE_MB:-32}"

x-comun: &recolector
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: facylf-recolectores:local
  restart: unless-stopped
  cgroup_parent: facylf.slice
  # ── DNS EXPLÍCITO (21/09/2026, ampliado a cuatro el 23/09/2026) ──────────────────────────────────────────
  #
  # El servidor tiene en `/etc/resolv.conf` los resolutores de Tailscale (`100.100.1.1`) pero Tailscale tiene el
  # DNS desactivado en esa máquina, así que el HOST no resuelve nada: ni `apt`, ni `docker pull`, ni el
  # autodeploy. Con Chrome dentro del contenedor el síntoma fue `net::ERR_NAME_NOT_RESOLVED` y la federación no
  # podía abrir un solo portal.
  #
  # Poner aquí los resolutores que SÍ existen evita el problema sin tocar el host (que necesita `sudo`):
  # el router de casa y Cloudflare. Si el servidor se muda de red, esto es lo primero que hay que revisar.
  #
  # ── POR QUÉ AHORA SON CUATRO Y NO DOS (medido el 23/09/2026) ─────────────────────────────────────────────
  #
  # Con dos, basta con que uno falle mientras el otro va lento para que el contenedor se quede sin resolver: es
  # lo que le pasó a Castilla-La Mancha, que estuvo un rato con `net::ERR_NAME_NOT_RESOLVED` mientras las demás
  # federaciones iban bien. Y su coste se ve en el ritmo: **62 actas/hora frente a 300** de las demás, porque
  # Chrome se caía en bucle y cada sesión se reiniciaba desde cero.
  #
  # Y los cuatro no son cuatro veces lo mismo: el router de casa resuelve por la red local y los tres públicos
  # son de proveedores distintos (Cloudflare, Google y Quad9). Para quedarse sin resolver tienen que caerse a la
  # vez el router y los tres, que es mucho pedir.
  dns:
    - "${FACYLF_DNS_1:-192.168.1.1}"
    - "${FACYLF_DNS_2:-1.1.1.1}"
    - "${FACYLF_DNS_3:-8.8.8.8}"
    - "${FACYLF_DNS_4:-9.9.9.9}"
  # Un navegador sin cabeza con sus procesos auxiliares medido dentro del contenedor: ~1,0 GB de RSS (que
  # sobreestima, porque Chrome comparte memoria entre sus procesos). El límite por contenedor es una red de
  # seguridad para un navegador desbocado, no el reparto: el reparto lo lleva el gobernador (11 plazas) y el
  # tope del conjunto lo pone la rebanada de cgroup de 10 GB.
  mem_limit: 1600m
  # Chrome necesita memoria compartida; los 64 MB por defecto de Docker se quedan cortos a la tercera página
  # (además el arranque añade --disable-dev-shm-usage cuando va sin cabeza).
  shm_size: 512m
  # ── TOPE DE PROCESADOR POR RECOLECTOR (20/09/2026) ───────────────────────────────────────────────────────
  #
  # El procesador del servidor es PEOR que el del PC donde se ha probado, y el PC ya se ponía al 100 % con la
  # flota: medido, los navegadores se llevaban 859 % de 1.114 % sobre 12 núcleos. Sin un tope, un puñado de
  # recolectores puede dejar sin CPU al resto del servidor (la web pública, el importador, la base de datos).
  #
  # Con esto, cada recolector no pasa de la mitad de un núcleo: la recolección va más despacio y **el servidor
  # sigue siendo utilizable**, que es la prioridad. Se ajusta con `FACYLF_CPUS_POR_RECOLECTOR` en el `.env`
  # (por ejemplo `1` si el servidor tiene núcleos de sobra).
  cpus: "${FACYLF_CPUS_POR_RECOLECTOR:-0.5}"
  # El entorno común viene de su ancla, para que un servicio pueda AÑADIR variables sin perderlo (ver arriba).
  environment: *ambiente-recolector
  volumes:
    - plazas:/app/.estado-workers
    # ── EL ÁRBOL DEL SSD, PARA TODAS (23/09/2026) ───────────────────────────────────────────────────────────
    #
    # `/srv/data` es un disco DURO y la máquina pasa un ~30 % del tiempo esperándolo. Las colas SQLite se mueven
    # al SSD con `scripts/servidor/mueve-cola-al-ssd.sh`, que **deja un enlace en la ruta de siempre** para que
    # ningún consumidor cambie de ruta. Para que ese enlace resuelva dentro del contenedor, el árbol del SSD se
    # monta en la MISMA ruta absoluta que en el host.
    #
    # Va en el ancla porque todas las federaciones lo necesitan; tener el montaje sin enlace no cambia nada, así
    # que se puede migrar federación a federación sin tocar esto.
    #
    # Medido en el piloto (Andalucía): las escrituras bajan de 4,11 s a 2,95 s por acta y `acta_guardar_estructura`
    # de 3,66 s a 2,41 s. El ciclo se queda en 8,2 s porque ahora manda la CORTESÍA (26 % del ciclo, esperada en
    # 171 de 250 trabajos): el trabajo ya es más corto que el suelo de 6-8 s.
    - /srv/ssd/facylf:/srv/ssd/facylf
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  andalucia:
    <<: *recolector
    # Pasa al PC (09/10/2026, petición de David): es la que más trabajo vencido tiene (~200.000 trabajos de 13
    # temporadas) y el PC tiene 12 núcleos frente a 4. Se traspasa con scripts/claude/traspasa-federaciones-al-pc.ps1,
    # que para el contenedor, trae la cola VIVA y quita a Andalucía de FACYLF_EXCLUIR en el PC. El perfil impide que
    # un `up -d` general la vuelva a arrancar aquí y se pidan las mismas actas desde las dos máquinas.
    profiles: ["recoge-en-pc"]
    command: ["bash", "docker/entrada-recolector.sh", "andalucia"]
    # ── SEGUNDA FEDERACIÓN DE MEDICIÓN (23/09/2026) ─────────────────────────────────────────────────────────
    #
    # Murcia ya se midió (`FACYLF_PERF=1` abajo) y su ciclo queda explicado: portal 39-53 %, escrituras, cortesía.
    # Pero Andalucía —una de las colas grandes, 66.000 trabajos pendientes— tarda **~21 s por trabajo** con
    # peticiones de 3,2 s de mediana, y NINGUNA petición se cuelga (la más lenta son 10 s, todas `ok`). Es decir:
    # le sobran ~17 s por vuelta que no son la red.
    #
    # Y no es que esté parada: hace peticiones en los 24 tramos de 5 minutos de dos horas seguidas, sin un solo
    # tramo vacío. Trabaja de forma continua y lenta, que es justo lo que la medición por fases sabe desglosar.
    #
    # Se instrumenta la SEGUNDA federación a propósito, como pedía el traspaso («en UNA federación primero, y
    # sólo después al resto»): si sale el mismo reparto que en Murcia, el patrón es del worker; si sale otro,
    # el problema es de esta cola —que es la más grande— y se habrá acotado sin tocar las 19.
    environment:
      <<: *ambiente-recolector
      # `FACYLF_SINCRONO` y `FACYLF_CACHE_MB` ya vienen del ancla para TODA la flota (ver arriba): se probaron
      # aquí primero y se midió la ganancia, así que ahora son el comportamiento por defecto.
      FACYLF_PERF: "1"
    volumes:
      # El CÓDIGO de los recolectores se monta del repositorio del servidor (07/10/2026): un `docker cp` se
      # pierde en cuanto se recrea el contenedor (pasó con el arreglo del índice de jornadas). Desplegar es
      # copiar `scripts/` y `perfiles/` a /srv/data/facylf y reiniciar; ver docs/plataforma-web/DESPLIEGUE-CODIGO.md.
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-andalucia:/app/descargas-andalucia

  aragon:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "aragon"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-aragon:/app/descargas-aragon

  asturias:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "asturias"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-asturias:/app/descargas-asturias

  baleares:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "baleares"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-baleares:/app/descargas-baleares

  canarias:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "canarias"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-canarias:/app/descargas-canarias

  cantabria:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "cantabria"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-cantabria:/app/descargas-cantabria

  castilla-la-mancha:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "castilla-la-mancha"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-castilla-la-mancha:/app/descargas-castilla-la-mancha

  cataluna:
    <<: *recolector
    # ── ESTAS TRES FEDERACIONES YA NO SE RECOGEN AQUÍ (24/09/2026) ─────────────────────────────────────────
    #
    # Valencia, Madrid y Cataluña pasan a recogerse en el PC de trabajo; el servidor se queda con las otras
    # dieciséis. El motivo de fondo es que las tres son las más pesadas y las que peor encajaban con el techo de
    # CPU de esta máquina (ver `docs/plataforma-web/RITMO-MEDIDO.md`).
    #
    # Se les pone un PERFIL para que un `docker compose up -d` general —el que se usa para levantar la flota
    # entera— NO las arranque por descuido: si se levantaran, pedirían a los mismos portales que el PC a la vez,
    # con peticiones duplicadas y riesgo de que el portal nos corte. Para arrancar una a propósito:
    #
    #     docker compose --project-name facylf --env-file docker/.env \
    #       -f docker/compose.yml -f docker/compose-turnos.yml up -d valencia
    #
    # (nombrarla explícitamente basta: el perfil sólo impide que entren por selección implícita). Y los datos no
    # se tocan: viven en el sistema de ficheros del servidor y se copiaron al PC antes de pararlas.
    profiles: ["recoge-en-pc"]
    command: ["bash", "docker/entrada-recolector.sh", "cataluna"]

    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-cataluna:/app/descargas-cataluna

  ceuta:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "ceuta"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-ceuta:/app/descargas-ceuta

  euskadi:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "euskadi"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-euskadi:/app/descargas-euskadi

  # Territorial/insular (05/10/2026): PNFG propio, la autonómica sólo publica lo autonómico. Ver
  # docs/plataforma-web/AUDITORIA-COMPLETITUD-2026-10-05.md §2.
  bizkaia:
    <<: *recolector
    # Sólo arranca si se nombra (`up -d bizkaia`) o con `--profile territoriales`: un `up -d` del proyecto entero
    # las levantó las cinco a la vez el 07/10 y la carga del servidor subió a 40-55.
    profiles: ["territoriales"]
    command: ["bash", "docker/entrada-recolector.sh", "bizkaia"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-bizkaia:/app/descargas-bizkaia

