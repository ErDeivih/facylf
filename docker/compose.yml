      - ../descargas-extremadura:/app/descargas-extremadura

  federacion:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "federacion"]
    volumes:
      - plazas:/app/.estado-workers
      - ../descargas-federacion:/app/descargas-federacion

  galicia:
