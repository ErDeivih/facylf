      - ../descargas-laspalmas:/app/descargas-laspalmas

  # Territorial/insular (05/10/2026): PNFG propio, la autonómica sólo publica lo autonómico. Ver
  # docs/plataforma-web/AUDITORIA-COMPLETITUD-2026-10-05.md §2.
  tenerife:
    <<: *recolector
