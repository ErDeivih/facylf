  federacion:
    <<: *recolector
    # ── EL CONTENEDOR SE LLAMA `facylf-federacion-1`, Y ASÍ SE QUEDA (16/11/2026) ─────────────────────────────
    #
    # Se probó a renombrarlo `facylf-castilla-y-leon-1` para que se encontrara buscando por el nombre de la
    # federación, y se revirtió el mismo día: el recolector de CyL es `facylf-federacion-1` y no se crea ni se
    # renombra nada. El nombre nuevo solo se resuelve en el código (`docker/lib-federacion.sh`,
    # `packages/canonico/src/resolucion/contexto.ts`), que traduce `castilla-y-leon` a esta misma cola.
    # 11/11/2026: en el servidor 1,6 GB no bastaban (Chrome + lectura de la cola) y el pageLoad de 60 s
    # se quedaba corto con las clasificaciones de 2026-27 (timeout del renderer a los ~60 s).
    # 14/11/2026: las ACTAS de PNGF tardan 75-86 s en cargar y algunas pasaban de 120 s -> timeout 118,4 s
    # y caída de la sesión del navegador (backoff de 10 min por cada una). Se sube pageLoad a 240 s en
    # entorno-servidor.env y la memoria a 4 GB. Con 240 s las mismas actas terminan en 75-86 s.
    mem_limit: 4096m
    memswap_limit: 4096m
    env_file:
      - ../descargas-federacion/recolector-local/entorno-servidor.env
    # El slug nuevo se usará cuando la imagen lleve `docker/lib-federacion.sh` (rebuild). Mientras tanto el
    # comando sigue diciendo `federacion`, que es lo que la imagen actual sabe traducir a descargas-federacion.
    command: ["bash", "docker/entrada-recolector.sh", "federacion"]
    # ── PRIORIDAD DE CPU PARA CyL (18/10/2026) ───────────────────────────────────────────────────────────────
    # Con la guardia de energía el slice tiene menos CPU, y cuando está lleno se reparte por PESO entre contenedores
    # (todos 1024 por defecto). Medido (petición 160): CyL usaba 61 % de su 100 % permitido y bajó de 287 a 125
    # peticiones/h, con el slice lleno (carga 11-14). Con 4096 gana a las demás cuando hay que elegir; si sobra CPU
    # no cambia nada. El tope (`cpus: 1.0`, compose-turnos.yml) sigue igual.
    cpu_shares: 4096
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-federacion:/app/descargas-federacion
      # (Aquí hubo un montaje del lanzador desde el repositorio, del 21/09/2026 al 22/09/2026: Castilla y León
      #  es la única federación que va SIN `--perfil`, y esa rama se añadió a `entrada-recolector.sh` después de
      #  construir la imagen. Con el DNS del servidor roto no se podía reconstruir. Ya no hace falta: la imagen
      #  se reconstruyó el 22/09/2026 y trae el lanzador corregido.)
      #
      # ── SU CONFIGURACIÓN VA MONTADA, NO DENTRO DE LA IMAGEN (23/09/2026) ─────────────────────────────────
      #
      # Castilla y León es la ÚNICA federación sin `--perfil`: el recolector decide su portal y su carpeta por
      # la AUSENCIA de ese argumento y lee `recolector.config.json` de la raíz. Y ese fichero **está en
      # `.gitignore`**, así que nunca llegó al servidor; como la imagen se construye desde el repositorio del
      # servidor, **no lo contenía**. Consecuencia medida el 23/09/2026: `opcionesChrome()` lanzaba
      # «Falta el contacto real (identidad.contacto) en recolector.config.json», el worker moría con código 1
      # en cada arranque y **la federación no recogía NADA**, con 45.935 trabajos esperando en su cola. El
      # monitor la contaba como «sin trabajo», que es lo que ocultaba la avería.
      #
      # Se monta en vez de copiarla a la imagen por el mismo motivo que el resto de los datos: es
      # configuración, no programa, y así se puede ajustar sin reconstruir. Las otras 18 federaciones llevan su
      # `recolector.<federación>.config.json` dentro de la imagen porque SÍ están versionados.
      - ../recolector.config.json:/app/recolector.config.json:ro

      # ── EL ARREGLO DE LAS PAUSAS GLOBALES, MONTADO PARA NO RECONSTRUIR (24/09/2026) ──────────────────────
      #
      # `recolector-local.mjs` y `recolector-valencia.mjs` se montan encima de la copia de la imagen porque
      # reconstruirla hoy cuesta ~25 min de CPU en una máquina que ya está al 100 % (el Dockerfile recompila
      # `dominio` e `ingesta` con `tsc -b`), y ese gasto sale de la propia recolección. Es el mismo camino que ya
      # se usó con `recolector.config.json` y, antes, con el lanzador (ver el comentario de arriba). Cuando la
      # máquina esté libre hay que reconstruir y quitar estos dos montajes.
      #
      # QUÉ ARREGLA, medido el 24/09/2026: un fallo de RED se contaba como fallo de la federación, así que cinco
      # `fetch failed` o cinco tiempos agotados —tres minutos de páginas lentas— activaban la pausa global de una
      # hora. Madrid terminó en pausa las 16 sesiones de 24 h (40.989 s parada, 11,4 h) teniendo 7.108 actas
      # disponibles; Valencia, las 5 de 5 (18.812 s, 5,2 h), y la última perdió una sesión que ya había recogido
      # 1.244 actas. Las otras diecisiete federaciones no se pararon ni una vez: no era la fuente, era el conteo.
      # Ahora los fallos de red llevan su propio contador (umbral 30, no 5) y no gastan los tres intentos que
      # declaran un acta como «la fuente no la publica».
      #
      # Se monta SÓLO el script que ejecuta cada servicio: esta federación usa `recolector-local.mjs`.
      #
      # ── Y EL FILTRO DE REPARTO POR TEMPORADAS (24/09/2026) ───────────────────────────────────────────────
      #
      # Castilla y León es la ÚNICA federación que se reparte por temporadas entre dos máquinas: este servidor
      # se queda la 2026-27 y el PC la 2025-26, cada uno con su fichero `temporadas-asignadas.txt` dentro de la
      # carpeta de la federación (que va montada). Así las dos piden a rfcylf.es en paralelo sin pedir lo mismo.
      #
      # Hay que montar DOS ficheros, no uno: la consulta que elige el trabajo vive en la BIBLIOTECA
      # (`scripts/lib/recolector-local.mjs`) y el filtro en un módulo nuevo que esa biblioteca importa
      # (`scripts/lib/temporadas-asignadas.mjs`). Montar sólo el primero daría un error de importación al
      # arrancar; montar sólo el segundo no cambiaría nada, porque nadie lo llamaría.
      #
      # Comprobado el 24/09/2026 por qué hace falta: el código de los recolectores vive DENTRO de la imagen, así
      # que este contenedor siguió trabajando la temporada 20 —todas— aunque su fichero de asignación ya decía
      # 2026-27 y se veía desde dentro. Montarlos es el camino rápido; la alternativa es reconstruir la imagen en
      # el PC y traerla, como se hizo con la web.

  galicia:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "galicia"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-galicia:/app/descargas-galicia

  madrid:
    <<: *recolector
    # Se recoge en el PC desde el 24/09/2026 (explicación completa en el servicio `cataluna`). El perfil impide
    # que un `up -d` general la arranque por descuido y duplique peticiones con el PC.
    profiles: ["recoge-en-pc"]
    command: ["bash", "docker/entrada-recolector.sh", "madrid"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-madrid:/app/descargas-madrid
      # ── EL CATÁLOGO DE SONDEO, POR VOLUMEN Y NO DENTRO DE LA IMAGEN (22/09/2026) ─────────────────────
      #
      # Madrid y Valencia (iSquad) leen el catálogo del sondeo, que vive en `descargas-federacion-sondeo/`. Esa
      # carpeta está en `.gitignore` —es DATO, no programa— así que no está en el repositorio y, al reconstruir
      # la imagen, dejó de estar dentro: los dos recolectores empezaron a fallar con
      #
      #     Error: No existe el catálogo de Valencia: /app/descargas-federacion-sondeo/valencia-isquad-sondeo.json
      #
      # Además, cada actualización del repositorio del servidor aparta en un `stash` lo que no está versionado,
      # así que meterlo en la imagen era frágil de todas formas. Se monta, como el resto de los datos.
      - ../descargas-federacion-sondeo:/app/descargas-federacion-sondeo:ro
      # El arreglo de las pausas globales por fallos de red (explicado entero en el servicio `federacion`).
      # Madrid terminó en pausa las 16 sesiones de 24 h: es la federación que más gana con este cambio.
      #
      # OJO CON ESTE MONTAJE, que me equivoqué la primera vez: el supervisor (`docker/entrada-recolector.sh`)
      # lanza `recolector-madrid.mjs` para Madrid, y ese fichero es un ENVOLTORIO de once líneas que hace
      # `await import('./recolector-valencia.mjs')`. Es decir: Madrid EJECUTA el recolector de Valencia, así que
      # el arreglo vive en `recolector-valencia.mjs` y montar aquí `recolector-local.mjs` no servía de nada (el
      # contenedor lo tenía montado y seguía pausándose, porque el que corre es el otro).

  melilla:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "melilla"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-melilla:/app/descargas-melilla

  murcia:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "murcia"]
    # ── FEDERACIÓN DE MEDICIÓN: el ciclo por fases (23/09/2026) ─────────────────────────────────────────────
    #
    # El traspaso pedía instrumentar el ciclo del worker «en UNA federación primero (por ejemplo galicia o
    # murcia), y sólo después al resto». Es Murcia porque es una PNFG corriente, con volumen suficiente para
    # tener muestra en minutos y sin las particularidades que contaminarían la medida: Galicia acumula esperas
    # por la cola («database is locked», 250 medidas) y Melilla/Cataluña tienen los portales más pesados.
    #
    # Con `FACYLF_PERF=1` el recolector apunta una línea por trabajo en
    # `descargas-murcia/recolector-local/perf-fases.jsonl` y se lee con `analiza-fases.mjs`. **Sin esta
    # variable el código de medición no ejecuta ni una línea**, así que las demás federaciones siguen igual.
    #
    # CUANDO TERMINE LA MEDICIÓN, ESTA VARIABLE SE QUITA: es un instrumento, no una configuración. Dejarla
    # puesta haría que Murcia escribiera un fichero para siempre a cambio de nada.
    environment:
      <<: *ambiente-recolector
      FACYLF_PERF: "1"
      # Aquí estuvo el primer experimento de `FACYLF_SINCRONO=NORMAL` (23/09/2026): midió −19 % de ciclo y por
      # eso ahora va en el ancla para toda la flota. Se deja `FACYLF_PERF` porque Murcia sigue siendo una de las
      # dos federaciones de medición.
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-murcia:/app/descargas-murcia

  navarra:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "navarra"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-navarra:/app/descargas-navarra

  rioja:
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "rioja"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-rioja:/app/descargas-rioja

  valencia:
    <<: *recolector
    # Se recoge en el PC desde el 24/09/2026 (explicación completa en el servicio `cataluna`). El perfil impide
    # que un `up -d` general la arranque por descuido y duplique peticiones con el PC.
    profiles: ["recoge-en-pc"]
    command: ["bash", "docker/entrada-recolector.sh", "valencia"]
    # ── ESCALÓN DE CORTESÍA EN PRUEBA (23/09/2026) ──────────────────────────────────────────────────────────
    #
    # Valencia es la ÚNICA federación cuyo ritmo lo manda de verdad la cortesía: medido, su hueco mediano entre
    # inicios de petición es 5,6 s y tiene 4-6 s configurados, así que sí está esperando. En las PNFG el hueco
    # mediano es 8,8-19,9 s, MÁS que su cortesía máxima (8 s): allí `ritmo.antes()` espera 0 s porque el trabajo
    # ya dura más, y bajar el intervalo no cambiaría nada.
    #
    # Se prueba aquí sin reconstruir la imagen porque `docker/entrada-recolector.sh` reenvía `FACYLF_ARGS` al
    # worker (los dos recolectores aceptan `--intervalo-min`/`--intervalo-max` por línea de órdenes y usan el
    # fichero de configuración sólo como respaldo). Se aplica recreando el contenedor:
    #     bash scripts/servidor/aplica-turnos.sh valencia
    #
    # ¡OJO CON EL SUELO DE 4 S! `Ritmo` comprueba `minimo < 4000` y **lanza un error** si no se cumple: un
    # `--intervalo-min` por debajo de 4 s NO baja el ritmo, DEJA LA FEDERACIÓN SIN RECOLECTAR (el worker muere con
    # código 1 y el supervisor reintenta cada 20 s). Pasó el 23/09/2026 probando 2-3 s: Valencia estuvo 37
    # minutos sin hacer una sola petición y el ritmo total de la flota cayó de ~65 a 57 pet/min. Es un suelo de
    # cortesía deliberado, no un límite técnico: se respeta.
    #
    # Por eso el escalón más bajo posible aquí es 4-5 s (media 4,5 frente a los 5,0 actuales, ~10 % menos espera).
    environment:
      <<: *ambiente-recolector
      FACYLF_ARGS: "--intervalo-min 4 --intervalo-max 5"
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-valencia:/app/descargas-valencia
      # Mismo caso que Madrid: el catálogo del sondeo es DATO y va montado (ver el comentario de Madrid).
      - ../descargas-federacion-sondeo:/app/descargas-federacion-sondeo:ro
      # El arreglo de las pausas globales por fallos de red (explicado entero en el servicio `federacion`).
      # Valencia se paró las 5 sesiones de 5 en 24 h, y perdió una que ya había recogido 1.244 actas. Ojo: usa
      # su PROPIO recolector, así que el arreglo vive en `recolector-valencia.mjs`, no en el común.

  # La federación de PRUEBA (`prueba-10gb`): misma cola que se usa en el PC para las pruebas del programa de
  # 10 GB. No es una federación real: sirve para comprobar que la imagen y el compose funcionan antes de tocar
  # nada de producción —
  #
  #     docker compose -f docker/compose.yml up -d prueba-10gb
  #
  # — y su cola lleva una marca `.PRUEBA` para que los informes de la flota no la cuenten como federación.
  #
  # Va en su PROPIO PERFIL (`pruebas`): así un `docker compose up -d` en el servidor levanta las federaciones de
  # verdad y no la de prueba. Y `docker compose up -d prueba-10gb` sigue funcionando igual, porque nombrar un
  # servicio activa su perfil (comprobado el 19/09/2026).
  prueba-10gb:
    profiles: ["pruebas"]
    <<: *recolector
    command: ["bash", "docker/entrada-recolector.sh", "prueba-10gb"]
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-prueba-10gb:/app/descargas-prueba-10gb

  # La pasada del fin de semana: reabre jornadas y actas del sábado y el domingo en TODAS las federaciones y
  # deja su informe. Necesita ver las colas de todas, por eso monta todas las carpetas.
  # ── SEGUNDO NAVEGADOR DE CYL (16/11/2026) ────────────────────────────────────────────────────────────
  # David pide dos navegadores en el servidor para Castilla y León. El recolector es de un trabajador por
  # federación (guarda de instancia única), así que el segundo va con SU PROPIA COLA y temporadas disjuntas:
  #   federacion  -> 2026-27 y 2024-25
  #   federacion2 -> 2023-24
  # Cada uno tiene su plaza reservada (slot-prioridad y slot-prioridad-2), así que ninguno espera turno.
  federacion2:
    <<: *recolector
    container_name: facylf-federacion2-1
    mem_limit: 4096m
    memswap_limit: 4096m
    env_file:
      - ../descargas-federacion/recolector-local/entorno-servidor.env
    command: ["bash", "docker/entrada-recolector.sh", "cyl-2"]
    cpus: 1.0
    environment:
      <<: *ambiente-recolector
      FACYLF_PRIORITARIA: "1"
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-federacion-2:/app/descargas-federacion-2
      - ../recolector.config.json:/app/recolector.config.json
      # El catálogo (competiciones y grupos) se comparte en SÓLO LECTURA desde la carpeta de la federación.
      - ../descargas-federacion:/app/descargas-federacion:ro

  federacion3:
    <<: *recolector
    container_name: facylf-federacion3-1
    mem_limit: 4096m
    memswap_limit: 4096m
    env_file:
      - ../descargas-federacion/recolector-local/entorno-servidor.env
    command: ["bash", "docker/entrada-recolector.sh", "cyl-3"]
    cpus: 1.0
    environment:
      <<: *ambiente-recolector
      FACYLF_PRIORITARIA: "0"
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../descargas-federacion-3:/app/descargas-federacion-3
      - ../recolector.config.json:/app/recolector.config.json
      # El catálogo (competiciones y grupos) se comparte en SÓLO LECTURA desde la carpeta de la federación.
      - ../descargas-federacion:/app/descargas-federacion:ro

  fin-de-semana:
    <<: *recolector
    mem_limit: 512m
    command: ["bash", "docker/entrada-fin-de-semana.sh", "${FACYLF_HORA_FINDE:-07:30}"]
    # ── DE QUÉ FEDERACIONES NO SE OCUPA ESTA MÁQUINA (24/09/2026) ──────────────────────────────────────────
    #
    # `FACYLF_EXCLUIR` es la MISMA variable que usa el supervisor del PC (`scripts/entorno-flota.ps1`), y
    # significa lo mismo en los dos sitios: «de estas no me ocupo yo». Allí evita que dos flotas pidan a la misma
    # federación; aquí dice cuáles se recogen en otro equipo.
    #
    # Importa de verdad: sin esto, este repaso abriría cada fin de semana las jornadas de Valencia, Madrid y
    # Cataluña para que alguien las revisara —y ese alguien ya no está en este servidor—, dejando trabajos
    # pendientes en colas que nadie consume y un informe que diría que faltan actas cuando lo que pasa es que las
    # trae el PC. Un informe que miente es peor que no tenerlo.
    #
    # OJO: declarar `environment:` en un servicio PISA el del ancla (es la trampa de YAML documentada al principio
    # de este fichero), así que hay que volver a fusionar `*ambiente-recolector` en la primera línea del bloque.
    environment:
      <<: *ambiente-recolector
      FACYLF_EXCLUIR: "${FACYLF_EXCLUIR:-valencia,madrid,cataluna,andalucia}"
    volumes:
      - ../scripts:/app/scripts:ro
      - ../perfiles:/app/perfiles:ro
      - plazas:/app/.estado-workers
      - /srv/ssd/facylf:/srv/ssd/facylf
      - ../pruebas/reconstruccion:/app/pruebas/reconstruccion
      - ../descargas-andalucia:/app/descargas-andalucia
      - ../descargas-aragon:/app/descargas-aragon
      - ../descargas-asturias:/app/descargas-asturias
      - ../descargas-baleares:/app/descargas-baleares
      - ../descargas-canarias:/app/descargas-canarias
      - ../descargas-cantabria:/app/descargas-cantabria
      - ../descargas-castilla-la-mancha:/app/descargas-castilla-la-mancha
      - ../descargas-cataluna:/app/descargas-cataluna
      - ../descargas-ceuta:/app/descargas-ceuta
      - ../descargas-euskadi:/app/descargas-euskadi
      - ../descargas-extremadura:/app/descargas-extremadura
      - ../descargas-federacion:/app/descargas-federacion
      - ../descargas-galicia:/app/descargas-galicia
      - ../descargas-madrid:/app/descargas-madrid
      - ../descargas-melilla:/app/descargas-melilla
      - ../descargas-murcia:/app/descargas-murcia
      - ../descargas-navarra:/app/descargas-navarra
      - ../descargas-rioja:/app/descargas-rioja
      - ../descargas-valencia:/app/descargas-valencia
      # El catálogo del sondeo va montado por el mismo motivo que en Madrid y Valencia: es dato, no está en el
      # repositorio, y sin él los dos recolectores de iSquad no arrancan.
      - ../descargas-federacion-sondeo:/app/descargas-federacion-sondeo:ro

  # La VIGILANCIA no va aquí a propósito: mide los contenedores DESDE FUERA (memoria de cada uno por cgroups,
  # reinicios, plazas ocupadas y quién espera) y para eso necesita el cliente de Docker, que no está —ni hace
  # falta— dentro de la imagen de los recolectores. Se programa con `cron` en el servidor:
  #
  #   0 * * * * cd /srv/facylf && node scripts/vigilar-docker.mjs --cada-min 1 --duracion-min 1 \
  #     >> pruebas/reconstruccion/vigilancia-cron.log 2>&1
  #
  # y su tendencia se mira con `node scripts/vigilar-docker.mjs --informe`.

volumes:
  # Las fichas de plaza de navegador, compartidas por TODOS los contenedores: es el semáforo del presupuesto.
  plazas:
