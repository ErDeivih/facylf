# Observabilidad de Fondo Popular. Se levanta aparte del stack web.
# Requiere que el compose de deploy/ esté arriba y comparta la red `deploy_default`.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas.yml:/etc/prometheus/alertas.yml:ro
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [facylf]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?falta GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3002:3000"]
    networks: [facylf]
    depends_on: [prometheus]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    ports: ["127.0.0.1:9100:9100"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?falta POSTGRES_EXPORTER_DSN}
    ports: ["127.0.0.1:9187:9187"]
    networks: [facylf]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports: ["127.0.0.1:8081:8080"]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    ports: ["127.0.0.1:9115:9115"]
    networks: [facylf]

volumes:
  prom-data:
  grafana-data:

networks:
  facylf:
    external: true
    name: deploy_default
