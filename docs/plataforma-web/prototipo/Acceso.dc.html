<div style="min-height: 100vh; background: #11181F; font-family: Inter, system-ui, sans-serif; color: #1A2027; display: flex; flex-direction: column">
<header style="max-width: 1240px; width: 100%; margin: 0 auto; padding: 16px 20px; box-sizing: border-box; display: flex; align-items: center; gap: 9px; color: #FFFFFF; font-weight: 800; font-size: 18px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#0B7285"></rect><circle cx="14" cy="14" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"></circle><path d="M14 7v14M7 14h14" stroke="#FFFFFF" stroke-width="1.5"></path></svg>facylf
</header>
<main style="flex: 1; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; align-items: flex-start; padding: 24px 20px 48px">
<section aria-labelledby="t1" style="flex: 1 1 360px; max-width: 420px; background: #FFFFFF; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h1 id="t1" style="margin: 0; font-size: 22px; font-weight: 800">Entrar</h1>
<div style="display: flex; flex-direction: column; gap: 5px"><label for="em" style="font-size: 13px; font-weight: 600">Correo</label><input id="em" type="email" value="david@ejemplo.es" style="height: 44px; border: 1px solid #CCD4DC; border-radius: 8px; padding: 0 12px; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 5px"><label for="pw" style="font-size: 13px; font-weight: 600">Contraseña</label><input id="pw" type="password" value="••••••••••••" style="height: 44px; border: 1px solid #CCD4DC; border-radius: 8px; padding: 0 12px; font-size: 15px"></div>
<button type="button" style="height: 46px; border: 0; border-radius: 8px; background: #0B7285; color: #FFFFFF; font-size: 15px; font-weight: 700">Entrar</button>
<button type="button" style="height: 44px; border: 1px solid #CCD4DC; border-radius: 8px; background: #FFFFFF; color: #1A2027; font-size: 14px; font-weight: 600">Recibir un enlace para entrar sin contraseña</button>
<div style="display: flex; justify-content: space-between; font-size: 13px"><a href="#">He olvidado la contraseña</a><span style="color: #5B6876">2FA para administradores</span></div>
</section>
<section aria-labelledby="t2" style="flex: 1 1 360px; max-width: 420px; background: #FFFFFF; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="t2" style="margin: 0; font-size: 22px; font-weight: 800">Crear cuenta</h2>
<p style="margin: 0; font-size: 14px; color: #3D4853">facylf es privada: se entra con una <strong>invitación</strong>. Si no tienes, pide una a quien te habló de la plataforma.</p>
<div style="display: flex; flex-direction: column; gap: 5px"><label for="nm" style="font-size: 13px; font-weight: 600">Nombre</label><input id="nm" value="Ana" style="height: 44px; border: 1px solid #CCD4DC; border-radius: 8px; padding: 0 12px; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 5px"><label for="em2" style="font-size: 13px; font-weight: 600">Correo</label><input id="em2" type="email" value="ana@ejemplo.es" style="height: 44px; border: 1px solid #CCD4DC; border-radius: 8px; padding: 0 12px; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 5px"><label for="pw2" style="font-size: 13px; font-weight: 600">Contraseña <span style="font-weight: 400; color: #5B6876">(10 caracteres o más)</span></label><input id="pw2" type="password" style="height: 44px; border: 1px solid #CCD4DC; border-radius: 8px; padding: 0 12px; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 5px"><label for="inv" style="font-size: 13px; font-weight: 600">Código de invitación</label><input id="inv" value="FAMILIA-2026" style="height: 44px; border: 1px solid #CCD4DC; border-radius: 8px; padding: 0 12px; font-size: 15px; letter-spacing: 0.06em"></div>
<label style="display: flex; gap: 10px; font-size: 13px; color: #3D4853; align-items: flex-start"><input type="checkbox" checked style="width: 18px; height: 18px; margin-top: 1px">Acepto el uso privado de los datos y que los nombres de menores no se muestran sin permiso.</label>
<button type="button" style="height: 46px; border: 0; border-radius: 8px; background: #11181F; color: #FFFFFF; font-size: 15px; font-weight: 700">Crear cuenta</button>
<div style="background: #E6F4F5; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #08596A">Te llegará un correo para confirmarlo. Con esta invitación entras con el paquete <strong>Ojeador</strong>.</div>
</section>
