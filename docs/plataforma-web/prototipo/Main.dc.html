<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F8;font-family:Inter,system-ui,sans-serif;color:#1A2027;font-feature-settings:"tnum" 1}
a{color:#0B7285;text-decoration:none}a:hover{color:#08596A;text-decoration:underline}
select,input,button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F6F8; font-family: Inter, system-ui, sans-serif; color: #1A2027">
<dc-import name="Cabecera" activo="" hint-size="100%,64px"></dc-import>

<main style="max-width: 1240px; margin: 0 auto; padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 22px">

<section aria-labelledby="buscar" style="background: #11181F; color: #FFFFFF; border-radius: 16px; padding: 26px 24px; display: flex; flex-direction: column; gap: 14px">
<h1 id="buscar" style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">¿A quién buscas?</h1>
<label for="q" style="position: absolute; left: -9999px">Buscar</label>
<div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 12px; padding: 6px 6px 6px 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6876" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input id="q" value="ezquerra" style="flex: 1; min-width: 0; border: 0; outline: 0; font-size: 17px; color: #1A2027; padding: 10px 0">
<button type="button" style="background: #0B7285; color: #FFFFFF; border: 0; border-radius: 8px; padding: 0 20px; font-size: 15px; font-weight: 600; height: 44px">Buscar</button>
</div>
<div style="background: #FFFFFF; color: #1A2027; border-radius: 12px; overflow: hidden">
<sc-for list="{{sugerencias}}" as="s" hint-placeholder-count="4">
<a href="{{s.href}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid #EEF1F4; color: #1A2027; text-decoration: none; min-height: 44px">
<span style="{{s.icono}}">{{s.ini}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">{{s.nombre}}</span><span style="font-size: 12px; color: #5B6876; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.contexto}}</span></div>
<span style="font-size: 11px; font-weight: 600; color: #5B6876; text-transform: uppercase; letter-spacing: 0.05em">{{s.tipo}}</span>
</a>
</sc-for>
</div>
</section>

<section aria-labelledby="exp" style="background: #FFFFFF; border: 1px solid #E1E6EB; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<h2 id="exp" style="margin: 0; font-size: 16px; font-weight: 700">Explorar una competición</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end">
<sc-for list="{{filtros}}" as="f" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 5px">
<label for="{{f.id}}" style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B6876">{{f.label}}</label>
<select id="{{f.id}}" style="height: 44px; border: 1px solid #CCD4DC; border-radius: 8px; padding: 0 10px; font-size: 14px; color: #1A2027; background: #FFFFFF">
<sc-for list="{{f.opciones}}" as="o" hint-placeholder-count="3"><option>{{o}}</option></sc-for>
</select>
</div>
</sc-for>
<a href="Competicion.dc.html" style="display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; background: #0B7285; color: #FFFFFF; font-weight: 600; font-size: 14px; text-decoration: none">Ver competición</a>
</div>
</section>

<section aria-labelledby="sig" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 id="sig" style="margin: 0; font-size: 18px; font-weight: 800">Tus equipos</h2><a href="#" style="font-size: 13px; font-weight: 600">Editar</a></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px">
<sc-for list="{{seguidos}}" as="e" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #E1E6EB; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
<a href="Equipo.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: #1A2027; text-decoration: none">
<svg width="34" height="38" viewBox="0 0 36 40" aria-hidden="true"><path d="M18 1 34 7v12c0 10-7 17-16 20C9 36 2 29 2 19V7Z" fill="{{e.color}}"></path><path d="M18 1 34 7v12c0 10-7 17-16 20Z" fill="#000000" fill-opacity="0.15"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">{{e.nombre}}</span><span style="font-size: 12px; color: #5B6876">{{e.comp}}</span></div>
<div style="text-align: right"><div style="font-size: 20px; font-weight: 800">{{e.pos}}</div><div style="font-size: 11px; color: #5B6876">{{e.pts}}</div></div>
</a>
<div style="display: flex; gap: 4px; padding: 0 16px 12px">
<sc-for list="{{e.forma}}" as="f" hint-placeholder-count="5"><span title="{{f.t}}" style="{{f.s}}">{{f.l}}</span></sc-for>
</div>
<a href="Acta.dc.html" style="display: flex; justify-content: space-between; gap: 8px; padding: 10px 16px; border-top: 1px solid #EEF1F4; font-size: 13px; color: #3D4853; text-decoration: none"><span>Último · {{e.ultimo}}</span><strong style="color: #1A2027">{{e.ultimoRes}}</strong></a>
<div style="display: flex; justify-content: space-between; gap: 8px; padding: 10px 16px; border-top: 1px solid #EEF1F4; font-size: 13px; color: #3D4853; background: #F9FAFB"><span>Próximo · {{e.prox}}</span><strong style="color: #1A2027">{{e.proxHora}}</strong></div>
</article>
</sc-for>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const ic = (bg, fg, r) => `width: 34px; height: 34px; border-radius: ${r}; background: ${bg}; color: ${fg}; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none`;
    const sugerencias = [
      { tipo: 'Jugador', ini: 'ME', nombre: 'Martín Ezquerra Valcárcel', contexto: 'U.D. Valdecastro "A" · Juvenil · Castilla y León y Madrid', href: 'Jugador.dc.html', icono: ic('#DDE3E9', '#3D4853', '50%') },
      { tipo: 'Jugador', ini: 'IE', nombre: 'Iván Ezquerra Gil', contexto: 'C.D. Mirador · Aficionados · Castilla y León', href: 'Jugador.dc.html', icono: ic('#DDE3E9', '#3D4853', '50%') },
      { tipo: 'Club', ini: 'EZ', nombre: 'C.D. Ezquerra Ribera', contexto: 'Ribera del Duero · Castilla y León', href: 'Club.dc.html', icono: ic('#1C5D99', '#FFFFFF', '8px') },
      { tipo: 'Árbitro', ini: 'AE', nombre: 'Andrés Ezquerra Mata', contexto: 'Comité de Salamanca', href: '#', icono: ic('#FFF1D6', '#8A5A00', '50%') },
    ];
    const filtros = [
      { id: 'f-fed', label: 'Federación', opciones: ['Castilla y León', 'Todas (cruzar)', 'Madrid', 'Cataluña'] },
      { id: 'f-tem', label: 'Temporada', opciones: ['2025-26', '2024-25'] },
      { id: 'f-cat', label: 'Categoría', opciones: ['Juvenil', 'Cadete', 'Aficionados'] },
      { id: 'f-div', label: 'División', opciones: ['Liga Nacional', 'División de Honor', 'Primera Regional'] },
      { id: 'f-gru', label: 'Grupo', opciones: ['Grupo 7', 'Grupo 1'] },
    ];
    const chip = { V: ['#1E7A47', 'Victoria'], E: ['#66717D', 'Empate'], D: ['#C0453B', 'Derrota'] };
    const forma = (s) => s.split('').map((l) => ({ l, t: chip[l][1], s: `display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #FFFFFF; background: ${chip[l][0]}` }));
    const seguidos = [
      { nombre: 'U.D. Valdecastro "A"', comp: 'Liga Nacional Juvenil · Grupo 7', pos: '1º', pts: '29 pts', color: '#1C5D99', forma: forma('VVEVV'), ultimo: 'vs C.D. Navalcruz', ultimoRes: '3-1', prox: 'vs C.D. Mirador · sáb', proxHora: '16:30' },
      { nombre: 'U.D. Valdecastro "B"', comp: 'Primera Provincial Juvenil · Salamanca', pos: '6º', pts: '17 pts', color: '#1C5D99', forma: forma('DVEVD'), ultimo: 'en C.D. Fuentes', ultimoRes: '2-2', prox: 'vs Atlético Peñalba "B" · dom', proxHora: '11:00' },
      { nombre: 'Atlético Peñalba', comp: 'Liga Nacional Juvenil · Grupo 7', pos: '3º', pts: '24 pts', color: '#2E7D4F', forma: forma('EVVDV'), ultimo: 'vs Racing Almenar', ultimoRes: '1-0', prox: 'vs C.D. Ribera del Tormes · sáb', proxHora: '12:00' },
    ];
    return { sugerencias, filtros, seguidos };
  }
}
</script>
</body>
</html>
